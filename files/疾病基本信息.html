<form id="form1" name="form1" method="post">
  <p style="text-align: center; font-family: '黑体'; font-size: 24px; color: rgba(253,1,178,1);">心脑血管疾病</p>
  <table width="61%" border="0" align="center" cellpadding="0" cellspacing="0">
    <tbody>
      <tr>
        <td height="104" style="color: rgba(236,9,13,1)"><p>心脑血管疾病是心脏血管和脑血管疾病的统称，泛指由于高脂血症、血液黏稠、动脉粥样硬化、高血压等所导致的心脏、大脑及全身组织发生的缺血性或出血性疾病。心脑血管疾病是一种严重威胁人类，特别是50岁以上中老年人健康的常见病，具有高患病率、高致残率和高死亡率的特点，即使应用目前最先进、完善的治疗手段，仍可有50%以上的脑血管意外幸存者生活不能完全自理，全世界每年死于心脑血管疾病的人数高达1500万人，居各种死因首位。 </p>
          <p><br>
        </p></td>
      </tr>
    </tbody>
  </table>
</form>
